name: OS Service CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://os_service:os_local_only@127.0.0.1:5433/os_service?schema=public
      OS_SERVICE_INTEGRATION_DATABASE_URL: postgresql://os_service:os_local_only@127.0.0.1:5433/os_service?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: os_service
          POSTGRES_USER: os_service
          POSTGRES_PASSWORD: os_local_only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U os_service -d os_service"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests and coverage gate
        run: npm run test:cov -- --runInBand

      - name: E2E tests
        run: npm run test:e2e -- --runInBand

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Apply database migrations
        run: npm run db:deploy

      - name: PostgreSQL integration tests
        run: npm run test:integration
